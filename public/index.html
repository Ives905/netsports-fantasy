<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetSports Fantasy - NHL Pools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, createContext, useContext } = React;

const API_URL = '/api';

// Same localStorage token key as both pools — sign in here and you're
// signed in everywhere, no separate account needed per pool.
const api = {
  token: localStorage.getItem('netsports-token'),
  setToken(token) {
    this.token = token;
    if (token) localStorage.setItem('netsports-token', token);
    else localStorage.removeItem('netsports-token');
  },
  async request(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (this.token) headers['Authorization'] = `Bearer ${this.token}`;
    const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error(`Server returned non-JSON response for ${endpoint} (status ${response.status})`);
    }
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  },
  async login(username, password) {
    const data = await this.request('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    if (data.token) this.setToken(data.token);
    return data;
  },
  async register(username, email, password) {
    const data = await this.request('/auth/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
    if (data.token) this.setToken(data.token);
    return data;
  },
  async getMe() { return this.request('/auth/me'); },
  logout() { this.setToken(null); }
};

const AuthContext = createContext(null);
function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (api.token) {
      api.getMe().then(data => setUser(data.user)).catch(() => api.logout()).finally(() => setLoading(false));
    } else {
      setLoading(false);
    }
  }, []);
  const login = async (username, password) => { const data = await api.login(username, password); setUser(data.user); return data; };
  const register = async (username, email, password) => { const data = await api.register(username, email, password); setUser(data.user); return data; };
  const logout = () => { api.logout(); setUser(null); };
  return <AuthContext.Provider value={{ user, setUser, login, register, logout, loading }}>{children}</AuthContext.Provider>;
}
const useAuth = () => useContext(AuthContext);

const Toast = ({ message, type, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
  return <div className={`fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 text-white font-medium ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>{message}</div>;
};

const Modal = ({ isOpen, onClose, title, children }) => {
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70" onClick={onClose} />
      <div className="relative bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-hidden">
        <div className="flex items-center justify-between p-4 border-b border-slate-700">
          <h3 className="text-xl font-bold text-white">{title}</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button>
        </div>
        <div className="p-4 overflow-y-auto max-h-[calc(90vh-80px)]">{children}</div>
      </div>
    </div>
  );
};

const LoadingSpinner = () => (
  <div className="flex items-center justify-center p-8">
    <div className="w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
  </div>
);

// Cross-pool nav lists — identical on every page.
const POOL_LINKS = [
  { label: 'Playoff Pickem Pool', href: '/draftpool.html' },
  { label: 'Saturday Night Pickem', href: '/pickem.html' }
];
const GROUP_LINKS = [
  { label: 'Playoff Pickem Pool Groups', href: '/draftpool.html?page=groups' },
  { label: 'Saturday Night Pickem Groups', href: '/pickem.html?page=groups' }
];
const RULES_LINKS = [
  { label: 'Playoff Pickem Pool Rules', href: '/draftpool.html?page=rules' },
  { label: 'Saturday Night Pickem Rules', href: '/pickem.html?page=rules' }
];

const NavDropdown = ({ label, items }) => {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(o => !o)}
        className="px-4 py-2 font-bold text-sm uppercase text-gray-300 hover:bg-slate-700 rounded-t-lg flex items-center gap-1">
        {label} <span className="text-xs">▾</span>
      </button>
      {open && (
        <div className="absolute left-0 top-full mt-0.5 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl py-1 min-w-[240px] z-50">
          {items.map(item => (
            <a key={item.label} href={item.href} className="block px-4 py-2 text-sm text-gray-200 hover:bg-slate-700 hover:text-white">{item.label}</a>
          ))}
        </div>
      )}
    </div>
  );
};

const AuthModal = ({ state, onClose, showToast }) => {
  const { login, register } = useAuth();
  const [mode, setMode] = useState(state.mode || 'login');
  const [form, setForm] = useState({ username: '', email: '', password: '' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => { setMode(state.mode || 'login'); setError(''); }, [state]);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setError('');
    try {
      if (mode === 'login') await login(form.username, form.password);
      else await register(form.username, form.email, form.password);
      showToast(mode === 'login' ? 'Welcome back!' : 'Account created!', 'success');
      onClose();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <Modal isOpen={state.open} onClose={onClose} title={mode === 'login' ? 'Sign In' : 'Create Account'}>
      <form onSubmit={submit} className="space-y-3">
        <input placeholder="Username" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })}
          className="w-full bg-slate-700 text-white rounded-lg px-3 py-2" required />
        {mode === 'register' && (
          <input placeholder="Email" type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })}
            className="w-full bg-slate-700 text-white rounded-lg px-3 py-2" required />
        )}
        <input placeholder="Password" type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
          className="w-full bg-slate-700 text-white rounded-lg px-3 py-2" required />
        {error && <div className="text-red-400 text-sm">{error}</div>}
        <button disabled={busy} className="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg font-bold disabled:opacity-50">
          {busy ? '...' : mode === 'login' ? 'Sign In' : 'Create Account'}
        </button>
        <button type="button" onClick={() => setMode(mode === 'login' ? 'register' : 'login')} className="w-full text-gray-400 text-sm hover:text-white">
          {mode === 'login' ? "Need an account? Sign up" : 'Already have an account? Sign in'}
        </button>
      </form>
    </Modal>
  );
};

const PoolButton = ({ emoji, name, href, accent }) => (
  <a href={href} className="flex items-center gap-3 bg-slate-800 hover:bg-slate-700 transition rounded-xl px-5 py-3 border-2 border-slate-700 hover:border-slate-500">
    <span className="text-2xl">{emoji}</span>
    <span className={`font-black ${accent}`}>{name}</span>
    <span className="text-gray-500 ml-1">→</span>
  </a>
);

const InfoStep = ({ number, title, children }) => (
  <div className="bg-slate-800 rounded-xl p-5">
    <div className="w-8 h-8 rounded-full bg-red-600 text-white font-black flex items-center justify-center mb-3">{number}</div>
    <h3 className="text-white font-bold mb-2">{title}</h3>
    <p className="text-gray-400 text-sm">{children}</p>
  </div>
);

const PoolInfoCard = ({ emoji, name, accent, href, children }) => (
  <div className="bg-slate-800 rounded-xl p-6">
    <div className="flex items-center gap-2 mb-3">
      <span className="text-2xl">{emoji}</span>
      <h3 className={`text-lg font-black ${accent}`}>{name}</h3>
    </div>
    <p className="text-gray-400 text-sm mb-4">{children}</p>
    <a href={href} className="text-sm font-bold text-white hover:text-gray-300">Go to pool →</a>
  </div>
);

function AppContent() {
  const { user, loading, logout } = useAuth();
  const [authModal, setAuthModal] = useState({ open: false, mode: 'login' });
  const [toast, setToast] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const showToast = (message, type = 'success') => setToast({ message, type });

  if (loading) return <LoadingSpinner />;

  return (
    <div className="min-h-screen bg-slate-950">
      <nav className="bg-slate-900 border-b-4 border-red-600 sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
          <div className="flex items-center gap-2">
            <span className="text-3xl">🏒</span>
            <span className="text-white font-black text-xl">NET<span className="text-red-500">SPORTS</span></span>
          </div>
          <div className="hidden md:flex items-center gap-1">
            <span className="px-4 py-2 font-bold text-sm uppercase text-white bg-red-600 rounded-t-lg">Home</span>
            <NavDropdown label="Pools" items={POOL_LINKS} />
            <NavDropdown label="Rules" items={RULES_LINKS} />
            <NavDropdown label="Groups" items={GROUP_LINKS} />
            <a href="/account.html" className="px-4 py-2 font-bold text-sm uppercase text-gray-300 hover:bg-slate-700 rounded-t-lg">My Account</a>
          </div>
          <div className="flex items-center gap-2">
            {user ? (
              <>
                <span className="text-white font-semibold hidden sm:block">{user.username}</span>
                <button onClick={logout} className="text-gray-400 hover:text-white text-sm">Logout</button>
              </>
            ) : (
              <>
                <button onClick={() => setAuthModal({ open: true, mode: 'login' })} className="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold">Sign In</button>
                <button onClick={() => setAuthModal({ open: true, mode: 'register' })} className="bg-red-600 text-white px-4 py-2 rounded-lg font-bold ml-2 hidden sm:block">Sign Up</button>
              </>
            )}
            <button onClick={() => setMobileMenuOpen(o => !o)} className="md:hidden text-white p-2">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
          </div>
        </div>
        {mobileMenuOpen && (
          <div className="md:hidden px-4 pb-4 space-y-3">
            <div>
              <div className="text-gray-500 text-xs uppercase font-bold px-1 mb-1">Pools</div>
              {POOL_LINKS.map(item => <a key={item.label} href={item.href} className="block px-3 py-2 rounded-lg text-gray-200 bg-slate-800 mb-1">{item.label}</a>)}
            </div>
            <div>
              <div className="text-gray-500 text-xs uppercase font-bold px-1 mb-1">Rules</div>
              {RULES_LINKS.map(item => <a key={item.label} href={item.href} className="block px-3 py-2 rounded-lg text-gray-200 bg-slate-800 mb-1">{item.label}</a>)}
            </div>
            <div>
              <div className="text-gray-500 text-xs uppercase font-bold px-1 mb-1">Groups</div>
              {GROUP_LINKS.map(item => <a key={item.label} href={item.href} className="block px-3 py-2 rounded-lg text-gray-200 bg-slate-800 mb-1">{item.label}</a>)}
            </div>
            <a href="/account.html" className="block px-3 py-2 rounded-lg text-gray-200 bg-slate-800 font-bold">My Account</a>
          </div>
        )}
      </nav>

      <div className="max-w-4xl mx-auto px-4 py-12">
        <div className="text-center mb-6">
          <h1 className="text-3xl md:text-5xl font-black text-white mb-4">NetSports Fantasy</h1>
          <p className="text-gray-400 text-lg max-w-2xl mx-auto">
            NHL hockey pools for friends and family — run by fans, for fans.
          </p>
        </div>

        <div className="flex flex-wrap items-center justify-center gap-3 mb-16">
          <PoolButton emoji="🏆" name="Playoff Pickem Pool" href="/draftpool.html" accent="text-red-500" />
          <PoolButton emoji="🗓️" name="Saturday Night Pickem" href="/pickem.html" accent="text-amber-400" />
        </div>

        <div className="mb-16">
          <h2 className="text-2xl font-black text-white text-center mb-8">How It Works</h2>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <InfoStep number="1" title="Sign Up">
              Create one free account. It works across both pools — no need to register twice.
            </InfoStep>
            <InfoStep number="2" title="Join or Create a Group">
              Play with your own group of friends and family using an invite code, or join a public group open to everyone.
            </InfoStep>
            <InfoStep number="3" title="Compete Every Week">
              Make your picks, track your rank on the leaderboard, and see who comes out on top.
            </InfoStep>
          </div>
        </div>

        <div className="mb-16">
          <h2 className="text-2xl font-black text-white text-center mb-2">Two Pools, Two Ways to Play</h2>
          <p className="text-gray-400 text-center mb-8 max-w-xl mx-auto">Play one, or play both — they run independently, so your picks in one never affect the other.</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <PoolInfoCard emoji="🏆" name="Playoff Pickem Pool" accent="text-red-500" href="/draftpool.html">
              Draft a roster under a salary cap before each playoff round, designate your star players for double points, and climb the leaderboard as your team racks up points through the playoffs.
            </PoolInfoCard>
            <PoolInfoCard emoji="🗓️" name="Saturday Night Pickem" accent="text-amber-400" href="/pickem.html">
              Every Saturday during the regular season, pick the winner of every NHL game on the schedule and guess the tiebreaker. Whoever gets the most picks right that week wins — plus a season-long leaderboard.
            </PoolInfoCard>
          </div>
        </div>

        {!user && (
          <div className="bg-blue-900/40 border border-blue-500/30 rounded-xl p-6 text-center">
            <h2 className="text-xl font-bold text-white mb-2">One account, both pools</h2>
            <p className="text-gray-300 mb-4">Sign up once and you're ready to join groups in either pool.</p>
            <button onClick={() => setAuthModal({ open: true, mode: 'register' })} className="bg-red-600 hover:bg-red-500 text-white px-6 py-3 rounded-lg font-bold">Get Started</button>
          </div>
        )}
      </div>

      <AuthModal state={authModal} onClose={() => setAuthModal({ open: false })} showToast={showToast} />
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}

function App() {
  return <AuthProvider><AppContent /></AuthProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
